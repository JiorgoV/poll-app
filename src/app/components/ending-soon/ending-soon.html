<section class="ending-soon">
    <h3 class="ending-soon__title">Ending soon surveys</h3>

    <div class="ending-soon__cards">
        @for (survey of surveyService.endingSoonSurveys(); track survey.id) {
        <article class="ending-soon__card">
            <span class="ending-soon__category">{{ survey.category }}</span>
            <h4 class="ending-soon__card-title">{{ survey.title }}</h4>
            <span class="ending-soon__badge">
                Ends in {{ surveyService.getDaysLeft(survey.endDate!) }}
                {{ surveyService.getDaysLeft(survey.endDate!) === 1 ? 'Day' : 'Days' }}
            </span>
        </article>
        }
    </div>
</section>
