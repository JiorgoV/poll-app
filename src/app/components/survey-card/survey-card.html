<article class="survey-card">
    <span class="survey-card__category">{{ survey().category }}</span>
    <h4 class="survey-card__title">{{ survey().title }}</h4>

    @if (!survey().endDate) {
    <span class="survey-card__badge">No deadline</span>
    } @else if (surveyService.isActive(survey())) {
    <span class="survey-card__badge">
        Ends in {{ surveyService.getDaysLeft(survey().endDate!) }}
        {{ surveyService.getDaysLeft(survey().endDate!) === 1 ? 'Day' : 'Days' }}
    </span>
    } @else {
    <span class="survey-card__badge">Ended</span>
    }
</article>
